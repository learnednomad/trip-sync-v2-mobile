name: Mobile Deployment - EAS Build & Deploy

on:
  push:
    branches: [main, develop]
    paths:
      - 'trip-sync-mobile-v2/**'
      - '.github/workflows/mobile-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'development'
        type: choice
        options:
        - development
        - staging
        - production
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
        - ios
        - android
        - all

env:
  NODE_VERSION: '18.x'
  PNPM_VERSION: '8.15.0'

defaults:
  run:
    working-directory: ./trip-sync-mobile-v2

jobs:
  determine-environment:
    name: 🎯 Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      should_deploy_ios: ${{ steps.platform.outputs.should_deploy_ios }}
      should_deploy_android: ${{ steps.platform.outputs.should_deploy_android }}
    
    steps:
      - name: 🎯 Set environment based on branch/input
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
          fi

      - name: 📱 Set platform deployment flags
        id: platform
        run: |
          PLATFORM="${{ github.event.inputs.platform }}"
          if [[ -z "$PLATFORM" ]]; then
            PLATFORM="all"
          fi
          
          if [[ "$PLATFORM" == "all" ]] || [[ "$PLATFORM" == "ios" ]]; then
            echo "should_deploy_ios=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy_ios=false" >> $GITHUB_OUTPUT
          fi
          
          if [[ "$PLATFORM" == "all" ]] || [[ "$PLATFORM" == "android" ]]; then
            echo "should_deploy_android=true" >> $GITHUB_OUTPUT
          else
            echo "should_deploy_android=false" >> $GITHUB_OUTPUT
          fi

  build-ios:
    name: 🍎 Build iOS
    runs-on: ubuntu-latest
    needs: [determine-environment]
    if: needs.determine-environment.outputs.should_deploy_ios == 'true'
    timeout-minutes: 45
    
    environment:
      name: ${{ needs.determine-environment.outputs.environment }}
    
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: trip-sync-mobile-v2/package-lock.json

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Prebuild
        run: cross-env APP_ENV=${{ needs.determine-environment.outputs.environment }} pnpm prebuild
        env:
          EXPO_NO_DOTENV: 1

      - name: 🍎 Build iOS with EAS
        run: |
          ENV=${{ needs.determine-environment.outputs.environment }}
          echo "🚀 Building iOS for environment: $ENV"
          
          if [[ "$ENV" == "production" ]]; then
            eas build --platform ios --profile production --non-interactive
          elif [[ "$ENV" == "staging" ]]; then
            eas build --platform ios --profile staging --non-interactive
          else
            eas build --platform ios --profile development --non-interactive
          fi
        env:
          APP_ENV: ${{ needs.determine-environment.outputs.environment }}

      - name: 📊 Build Success Notification
        if: success()
        run: |
          echo "✅ iOS build completed successfully for ${{ needs.determine-environment.outputs.environment }}"

  build-android:
    name: 🤖 Build Android
    runs-on: ubuntu-latest
    needs: [determine-environment]
    if: needs.determine-environment.outputs.should_deploy_android == 'true'
    timeout-minutes: 45
    
    environment:
      name: ${{ needs.determine-environment.outputs.environment }}
    
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: trip-sync-mobile-v2/package-lock.json

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Prebuild
        run: cross-env APP_ENV=${{ needs.determine-environment.outputs.environment }} pnpm prebuild
        env:
          EXPO_NO_DOTENV: 1

      - name: 🤖 Build Android with EAS
        run: |
          ENV=${{ needs.determine-environment.outputs.environment }}
          echo "🚀 Building Android for environment: $ENV"
          
          if [[ "$ENV" == "production" ]]; then
            eas build --platform android --profile production --non-interactive
          elif [[ "$ENV" == "staging" ]]; then
            eas build --platform android --profile staging --non-interactive
          else
            eas build --platform android --profile development --non-interactive
          fi
        env:
          APP_ENV: ${{ needs.determine-environment.outputs.environment }}

      - name: 📊 Build Success Notification
        if: success()
        run: |
          echo "✅ Android build completed successfully for ${{ needs.determine-environment.outputs.environment }}"

  deploy-ota-update:
    name: 📡 Deploy OTA Update
    runs-on: ubuntu-latest
    needs: [determine-environment, build-ios, build-android]
    if: |
      always() && 
      needs.determine-environment.outputs.environment != 'production' &&
      (needs.build-ios.result == 'success' || needs.build-android.result == 'success')
    timeout-minutes: 15

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: trip-sync-mobile-v2/package-lock.json

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📡 Publish OTA Update
        run: |
          ENV=${{ needs.determine-environment.outputs.environment }}
          echo "📡 Publishing OTA update for environment: $ENV"
          
          if [[ "$ENV" == "staging" ]]; then
            eas update --branch staging --message "Automated OTA update for staging from commit ${{ github.sha }}"
          else
            eas update --branch development --message "Automated OTA update for development from commit ${{ github.sha }}"
          fi
        env:
          APP_ENV: ${{ needs.determine-environment.outputs.environment }}

  deploy-to-stores:
    name: 🏪 Deploy to App Stores
    runs-on: ubuntu-latest
    needs: [determine-environment, build-ios, build-android]
    if: |
      always() && 
      needs.determine-environment.outputs.environment == 'production' &&
      (needs.build-ios.result == 'success' || needs.build-android.result == 'success')
    timeout-minutes: 30
    environment: 
      name: production
      url: https://apps.apple.com/app/trip-sync

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🍎 Submit to Apple App Store
        if: needs.determine-environment.outputs.should_deploy_ios == 'true'
        run: |
          echo "🍎 Submitting to Apple App Store..."
          eas submit --platform ios --profile production --non-interactive
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: 🤖 Submit to Google Play Store
        if: needs.determine-environment.outputs.should_deploy_android == 'true'
        run: |
          echo "🤖 Submitting to Google Play Store..."
          eas submit --platform android --profile production --non-interactive
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

  notification:
    name: 📢 Deployment Notification
    runs-on: ubuntu-latest
    needs: [determine-environment, build-ios, build-android, deploy-ota-update, deploy-to-stores]
    if: always()

    steps:
      - name: 📊 Determine overall status
        id: status
        run: |
          if [[ "${{ needs.build-ios.result }}" == "success" ]] || [[ "${{ needs.build-android.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=✅ Mobile deployment completed successfully" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Mobile deployment failed" >> $GITHUB_OUTPUT
          fi

      - name: 📱 Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ steps.status.outputs.status }}
          channel: '#trip-sync-deployments'
          username: 'EAS Deploy Bot'
          icon_emoji: ':rocket:'
          title: 'Trip Sync Mobile Deployment'
          text: |
            ${{ steps.status.outputs.message }}
            
            *Environment:* ${{ needs.determine-environment.outputs.environment }}
            *Branch:* ${{ github.ref_name }}
            *Commit:* ${{ github.sha }}
            *iOS Build:* ${{ needs.build-ios.result }}
            *Android Build:* ${{ needs.build-android.result }}
            *OTA Update:* ${{ needs.deploy-ota-update.result }}
            *Store Deployment:* ${{ needs.deploy-to-stores.result }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: env.SLACK_WEBHOOK_URL != ''

      - name: 📝 Create deployment summary
        run: |
          echo "## 🚀 Mobile Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.determine-environment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- iOS Build: ${{ needs.build-ios.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Android Build: ${{ needs.build-android.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Results" >> $GITHUB_STEP_SUMMARY
          echo "- OTA Update: ${{ needs.deploy-ota-update.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Store Submission: ${{ needs.deploy-to-stores.result }}" >> $GITHUB_STEP_SUMMARY